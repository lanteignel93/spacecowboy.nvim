# spacecowboy — generated by ~/dotfiles/theme/render.py; do not edit
# appended through LG_CONFIG_FILE (comma-joined), after ~/.config/lazygit/config.yml
gui:
  theme:
    activeBorderColor:
      - "#a8d88a"
      - bold
    inactiveBorderColor:
      - "#8a6a52"
    searchingActiveBorderColor:
      - "#f0c090"
      - bold
    optionsTextColor:
      - "#b7d9a0"
    selectedLineBgColor:
      - "#362a20"
    inactiveViewSelectedLineBgColor:
      - "#2a2019"
    cherryPickedCommitBgColor:
      - "#43352a"
    cherryPickedCommitFgColor:
      - "#a8d88a"
    unstagedChangesColor:
      - "#e07a5f"
    defaultFgColor:
      - "#d3c6b0"
  authorColors:
    "*": "#d3c6b0"
  branchColorPatterns:
    "^main$": "#a8d88a"
    "^master$": "#a8d88a"
