# spacecowboy for tuicr — generated by ~/dotfiles/theme/render.py; do not edit
# installed as ~/.config/tuicr/themes/spacecowboy.toml; selected with `tuicr --theme spacecowboy`

# Base panels & text
panel_bg = "#201812"
bg_highlight = "#362a20"
fg_primary = "#d3c6b0"
fg_secondary = "#a99a85"
fg_dim = "#7a6852"

# Diff
diff_add = "#b7d9a0"
diff_add_bg = "#3b3b2c"
diff_del = "#f0a58a"
diff_del_bg = "#453128"
diff_context = "#d3c6b0"
diff_hunk_header = "#f3e9d6"
expanded_context_fg = "#7a6852"

# Syntax-tinted diff backgrounds
syntax_add_bg = "#3b3b2c"
syntax_del_bg = "#453128"
syntax_theme = "spacecowboy-syntax.tmTheme"

# File status
file_added = "#b7d9a0"
file_modified = "#f0c090"
file_deleted = "#f0a58a"
file_renamed = "#d3c6b0"

# Review progress
reviewed = "#e59a5b"
pending = "#f0c090"

# Comment classifications
comment_note = "#a99a85"
comment_suggestion = "#b7d9a0"
comment_issue = "#e07a5f"
comment_praise = "#a8d88a"

# UI chrome
border_focused = "#a8d88a"
border_unfocused = "#8a6a52"
status_bar_bg = "#201812"
cursor_color = "#e59a5b"
cursor_line_bg = "#2a2019"
branch_name = "#d3c6b0"
help_indicator = "#7a6852"

# Inline messages (dark fg on saturated bg)
message_info_fg = "#201812"
message_info_bg = "#a99a85"
message_warning_fg = "#201812"
message_warning_bg = "#f0c090"
message_error_fg = "#201812"
message_error_bg = "#e07a5f"
update_badge_fg = "#201812"
update_badge_bg = "#a8d88a"

# Mode indicator
mode_fg = "#201812"
mode_bg = "#e59a5b"
