# spacecowboy — generated by ~/dotfiles/theme/render.py from palettes/spacecowboy.toml; do not edit
# included by kitty.conf via: include ${HOME}/.config/theme/current/kitty.conf

background       #130e0a
foreground       #f3e9d6

cursor           #e59a5b
cursor_text_color #201812

selection_background #362a20
selection_foreground #f3e9d6
url_color        #f3e9d6

# black · red · green · yellow · blue · magenta · cyan · white
color0  #201812
color1  #e0623f
color2  #b7d9a0
color3  #f0c090
color4  #b7d9a0
color5  #d3c6b0
color6  #a99a85
color7  #ffffff

# bright · color8 is the comment grey, not the panel, so dim CLI text stays visible
color8  #7a6852
color9  #e0623f
color10 #b7d9a0
color11 #f0c090
color12 #b7d9a0
color13 #d3c6b0
color14 #a99a85
color15 #ffffff

# tab bar and borders follow the panel
active_tab_foreground   #201812
active_tab_background   #a8d88a
inactive_tab_foreground #a99a85
inactive_tab_background #201812
active_border_color     #e59a5b
inactive_border_color   #7a6852
