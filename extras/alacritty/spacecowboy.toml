# Use: save this file next to alacritty.toml (Linux/macOS ~/.config/alacritty/,
# Windows %APPDATA%\alacritty\) as themes/spacecowboy.toml, then in alacritty.toml:
#   [general]                            # 0.14+; older versions: a top-level import =
#   import = ["themes/spacecowboy.toml"]    # relative to alacritty.toml
